<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIAP | CP05 - Security Pipeline</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(145deg, #091324, #142747); color: #f5f7ff; padding: 24px; }
    main { max-width: 760px; width: 100%; padding: 48px; border: 1px solid #425571;
      border-radius: 20px; background: rgba(255,255,255,.045); }
    .label { color: #77dcce; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(30px, 6vw, 52px); line-height: 1.1; }
    p { line-height: 1.7; color: #d4dced; }
    .cards { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 12px; }
    .card { border: 1px solid #465f80; border-radius: 12px; padding: 20px; }
    .card strong { display: block; margin-bottom: 6px; }
    footer { margin-top: 28px; font-size: 14px; color: #9aabc7; }
  </style>
</head>
<body>
  <main>
    <div class="label">FIAP · DevOps e Cloud</div>
    <h1>Security Pipeline</h1>
    <p>Checkpoint 05: integração contínua com verificações automatizadas para proteger código, segredos e imagens Docker.</p>
    <section class="cards" aria-label="Ferramentas de segurança">
      <div class="card"><strong>Gitleaks</strong><span>Segredos no Git</span></div>
      <div class="card"><strong>Semgrep</strong><span>Análise de código</span></div>
      <div class="card"><strong>Trivy</strong><span>CVEs no Docker</span></div>
    </section>
    <footer>Pipeline de referência · Checkpoint FIAP</footer>
  </main>
</body>
</html>
